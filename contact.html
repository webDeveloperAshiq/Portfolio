    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const form = document.getElementById("contact-form");
            const button = form.querySelector('button[type="submit"]');

            const messageBox = document.createElement("div");

            messageBox.id = "contact-form-message";
            messageBox.style.display = "none";
            messageBox.style.marginTop = "20px";
            messageBox.style.padding = "14px 18px";
            messageBox.style.fontSize = "16px";
            messageBox.style.border = "1px solid";

            form.appendChild(messageBox);

            form.addEventListener("submit", async function (e) {

                e.preventDefault();

                const originalButton = button.innerHTML;

                // Loading
                button.disabled = true;
                button.innerHTML =
                    'Sending... <i class="fal fa-spinner fa-spin"></i>';

                messageBox.style.display = "none";

                try {

                    const formData = new FormData(form);

                    // Web3Forms official JSON method
                    const object = Object.fromEntries(formData);
                    const json = JSON.stringify(object);

                    const response = await fetch(
                        "https://api.web3forms.com/submit",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",
                                "Accept": "application/json"
                            },

                            body: json
                        }
                    );

                    const data = await response.json();

                    console.log("Web3Forms response:", data);

                    if (response.status === 200 && data.success) {

                        messageBox.style.display = "block";
                        messageBox.style.color = "#00c853";
                        messageBox.style.borderColor = "#00c853";

                        messageBox.innerHTML =
                            '<i class="fal fa-check-circle"></i> ' +
                            'Message sent successfully!';

                        form.reset();

                    } else {

                        messageBox.style.display = "block";
                        messageBox.style.color = "#ff4444";
                        messageBox.style.borderColor = "#ff4444";

                        messageBox.innerHTML =
                            '<i class="fal fa-times-circle"></i> ' +
                            (data.message || "Something went wrong.");

                        console.log("Web3Forms error:", data);
                    }

                } catch (error) {

                    console.error("Form error:", error);

                    messageBox.style.display = "block";
                    messageBox.style.color = "#ff4444";
                    messageBox.style.borderColor = "#ff4444";

                    messageBox.innerHTML =
                        '<i class="fal fa-times-circle"></i> ' +
                        'Unable to send your message. Please try again.';

                }

                // Button restore
                button.disabled = false;
                button.innerHTML = originalButton;
            });
        });
    </script>
